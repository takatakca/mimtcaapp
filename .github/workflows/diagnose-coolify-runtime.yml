name: MIMT Coolify Read-only Runtime Audit

# Temporary diagnostic: never prints secret values, environment connection
# strings, database names, application UUIDs, or API response bodies.
on:
  push:
    branches: [diag/mimt-coolify-runtime-audit-20261010]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Coolify application and database configuration safely
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse

          endpoint=os.environ.get("COOLIFY_URL","").rstrip("/")
          token=os.environ.get("COOLIFY_TOKEN","")
          uuid=os.environ.get("COOLIFY_API_UUID","")
          if not endpoint.startswith("https://") or not token or not uuid:
              raise SystemExit("Audit cannot proceed: missing HTTPS Coolify connection or credentials")
          url=endpoint+"/api/v1"
          hdr={"Authorization":"Bearer "+token,"Accept":"application/json"}

          def get(path):
              req=urllib.request.Request(url+path,headers=hdr,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:
                      data=json.loads(res.read(1500000).decode())
                      return data
              except urllib.error.HTTPError as exc:
                  print("Coolify GET",path.rsplit("/",1)[-1] if not path.startswith("/applications/") else "application endpoint","HTTP",exc.code)
                  return None
              except Exception as exc:
                  print("Coolify API request failed:",type(exc).__name__)
                  return None

          app=get("/applications/"+urllib.parse.quote(uuid,safe=""))
          if isinstance(app,dict):
              for k in ("status","build_pack","dockerfile","base_directory","publish_directory","ports_exposes"):
                  val=app.get(k)
                  if val is None: continue
                  if k == "status" and isinstance(val,str):
                      print("Coolify app status:",val[:60])
                  elif k=="ports_exposes":
                      print("Coolify exposes 8080:", "8080" in str(val))
                  elif k=="build_pack":
                      print("Coolify build pack Dockerfile:",str(val).lower()=="dockerfile")
                  else:
                      print("Coolify",k,"configured:",bool(val))
          else:
              print("Coolify application metadata unavailable.")

          env=get("/applications/"+urllib.parse.quote(uuid,safe="")+"/envs")
          keys={}
          if isinstance(env,dict):
              env=env.get("data",env.get("envs",[]))
          if isinstance(env,list):
              for v in env:
                  if isinstance(v,dict) and isinstance(v.get("key"),str):
                      keys[v["key"]]=v
              print("Coolify env variable count:",len(keys))
              for k in ("DATABASE_URL","DATABASE_SSL_CA_PEM","NODE_EXTRA_CA_CERTS","NODE_TLS_REJECT_UNAUTHORIZED","PUBLIC_BASE_URL","NODE_ENV","PORT"):
                  print("CONFIG",k,"present:",k in keys)
              def retrieve(k):
                  ob=keys.get(k,{})
                  v=ob.get("real_value") or ob.get("value")
                  return v if isinstance(v,str) else None
              conn=retrieve("DATABASE_URL")
              if conn:
                  try:
                      parsed=urllib.parse.urlsplit(conn)
                      host=(parsed.hostname or "").lower()
                      group="supabase" if "supabase" in host else ("internal-docker" if not "." in host or host.endswith(".internal") else "external-other")
                      print("DB host class:",group)
                      print("DB URL port:",parsed.port or "default")
                      opts=urllib.parse.parse_qs(parsed.query)
                      print("DB URL SSL flags:",{k:("present" if k in opts else "absent") for k in ("sslmode","ssl","sslrootcert")})
                      for k in ("sslmode",):
                          if k in opts:
                              print("DB SSL mode:",opts[k][0] if opts[k][0] in ("disable","allow","prefer","require","verify-ca","verify-full","no-verify") else "other")
                  except (ValueError,AttributeError):
                      print("DB URL could not be structurally parsed.")
              else:
                  print("DB URL value hidden from this API (presence alone doesn't prove correctness).")
              pem=retrieve("DATABASE_SSL_CA_PEM")
              if pem:
                  print("Database CA PEM formatting:", "valid PEM markers" if "BEGIN CERTIFICATE" in pem and "END CERTIFICATE" in pem else "NOT PEM")
              elif "DATABASE_SSL_CA_PEM" in keys:
                  print("Database CA PEM is defined but value hidden, can't validate.")
              else:
                  print("Database CA PEM not configured in Coolify.")
              if retrieve("NODE_TLS_REJECT_UNAUTHORIZED")=="0":
                  print("WARNING: TLS verification globally disabled! Remove unsafe setting.")
          else:
              print("Could not inspect Coolify environment variable names.")
          dbs=get("/databases")
          if isinstance(dbs,dict):
              dbs=dbs.get("data",dbs.get("databases",[]))
          if isinstance(dbs,list):
              print("Coolify standalone database resources:",len(dbs))
              for d in dbs[:30]:
                  if not isinstance(d,dict):continue
                  nam=str(d.get("name",""))
                  print("DB Resource: type=",str(d.get("type") or d.get("database_type") or "unknown")[:30],
                        "is MIMT-named=",("mimt" in nam.lower()),
                        "status=",str(d.get("status") or "unknown")[:60],
                        "SSL field present=",any("ssl" in k.lower() for k in d.keys()))
          else:
              print("Coolify database listing unavailable (possibly insufficient token permissions).")
          print("Audit complete. No secrets, database URLs, or private endpoints printed. NO resources modified.")
          PY


      - name: Check database CA certificate metadata and sanitize runtime errors
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,ssl,re,datetime,urllib.request,urllib.error,tempfile,subprocess
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          uid=os.environ["COOLIFY_API_UUID"]
          token=os.environ["COOLIFY_TOKEN"]
          def get(suffix):
              req=urllib.request.Request(base+"/applications/"+uid+suffix,
                  headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      return json.loads(r.read(500000).decode())
              except urllib.error.HTTPError as e:
                  print("Coolify request",suffix or "/application","HTTP",e.code)
              except Exception as e:
                  print("Coolify request",suffix or "/application","failed:",type(e).__name__)
              return None
          app=get("")
          if isinstance(app,dict):
              for name in ("git_commit_sha","git_repository","git_branch","status"):
                  v=app.get(name)
                  if name=="git_commit_sha":print("Coolify current git commit:",str(v)[:12] if v else "not supplied")
                  elif name=="git_repository":print("Coolify repository matches MIMT:", "mimt" in str(v).lower())
                  elif name=="git_branch":print("Coolify branch main:",v=="main")
                  elif name=="status":print("Coolify status:",str(v)[:64])
          env=get("/envs")
          if isinstance(env,dict):env=env.get("data",env.get("envs",[]))
          def getkey(name):
              if not isinstance(env,list):return None
              return next((v for v in env if isinstance(v,dict) and v.get("key")==name),None)
          cert=getkey("DATABASE_SSL_CA_PEM")
          if cert:
              for name in ("is_runtime","is_buildtime","is_multiline","is_literal"):
                  print("DATABASE_SSL_CA_PEM",name,cert.get(name,"unspecified"))
              pem=cert.get("real_value") or cert.get("value") or ""
              if isinstance(pem,str):
                  pem=pem.replace("\\n","\n")
                  certs=re.findall("-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",pem,re.DOTALL)
                  print("PEM certificate count:",len(certs))
                  if certs:
                      with tempfile.NamedTemporaryFile(mode="w",suffix=".pem") as tmp:
                          tmp.write(certs[0]);tmp.flush()
                          p=subprocess.run(["openssl","x509","-in",tmp.name,"-noout","-text"],capture_output=True,text=True)
                          if p.returncode!=0:
                              print("CA certificate parse: INVALID")
                          else:
                              print("CA certificate parse: VALID")
                              detail=p.stdout
                              print("CA basic constraints CA:TRUE:",bool(re.search(r"CA:TRUE",detail)))
                              print("CA currently within validity period:",subprocess.run(
                                  ["openssl","x509","-in",tmp.name,"-checkend","0","-noout"],
                                  capture_output=True).returncode==0)
          else:
              print("DATABASE_SSL_CA_PEM: unavailable")
          resp=get("/logs?lines=120")
          if isinstance(resp,dict):
              logs=str(resp.get("logs") or "")
              patterns=[
                  ("self-signed certificate chain",r"self-signed certificate in certificate chain"),
                  ("TLS unable to verify",r"unable to verify|certificate verify failed"),
                  ("hostname mismatch",r"hostname.*mismatch|ERR_TLS_CERT_ALTNAME_INVALID"),
                  ("startup invalid sslrootcert",r"unrecognized configuration parameter.*sslrootcert|invalid configuration parameter.*sslrootcert"),
                  ("auth failed",r"password authentication failed"),
                  ("DB connection refused",r"ECONNREFUSED"),
                  ("DB timeout",r"ETIMEDOUT|CONNECT_TIMEOUT"),
                  ("DB DNS error",r"ENOTFOUND"),
                  ("outbox failure",r"outbox delivery failed")
              ]
              print("Sanitized runtime log categories (may include repeat stacks):")
              for label,pattern in patterns:
                  print(label+":",len(re.findall(pattern,logs,re.I)))
              print("Log returned characters:",len(logs))
          print("Certificate/log diagnostic complete. No secrets or full logs printed; no resources changed.")
          PY


      - name: Determine if Coolify exposes a genuine server CA without exposing keys
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          token=os.environ["COOLIFY_TOKEN"]
          uuid=os.environ["COOLIFY_API_UUID"]
          def get(path):
              try:
                  req=urllib.request.Request(base+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=18) as response:
                      return json.loads(response.read(1000000))
              except urllib.error.HTTPError as e:
                  print("read-only endpoint:",path.split("/")[1],"HTTP",e.code)
              except Exception as e:
                  print("read-only endpoint failed:",type(e).__name__)
              return None
          app=get("/applications/"+uuid)
          print("Application server reference available:",bool(isinstance(app,dict) and app.get("destination")))
          servers=get("/servers")
          if isinstance(servers,dict):servers=servers.get("data",servers.get("servers"))
          if not isinstance(servers,list):servers=[]
          print("Accessible Coolify servers:",len(servers))
          for server in servers[:10]:
              if not isinstance(server,dict):continue
              cert_fields=[k for k in server if "ca_cert" in k.lower() or "ssl_cert" in k.lower()]
              print("Server resource: accessible; certificate-specific fields:",",".join(cert_fields) if cert_fields else "none")
              if server.get("uuid"):
                  detail=get("/servers/"+server["uuid"])
                  if isinstance(detail,dict):
                      keys=[k for k in detail if "certificate" in k.lower() or "ssl" in k.lower() or "ca_cert" in k.lower()]
                      print("Server detail CA/SSL field names:",",".join(keys) if keys else "none")
                      print("CA PEM directly retrievable:",any(
                          isinstance(detail.get(k),str) and "BEGIN CERTIFICATE" in detail[k] 
                          for k in keys))
          print("Server inventory inspected without printing names, IPs, UUIDs, tokens or certificates.")
          PY


      - name: Identify certificate formatting failure without showing certificate
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          python - <<'PY'
          import os,ssl,re,base64,subprocess,tempfile,urllib.request,json
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1/applications/"+os.environ["COOLIFY_API_UUID"]+"/envs"
          req=urllib.request.Request(base,headers={"Authorization":"Bearer "+os.environ["COOLIFY_TOKEN"]})
          with urllib.request.urlopen(req,timeout=20) as res:
              env=json.load(res)
          if isinstance(env,dict):env=env.get("data",env.get("envs",[]))
          obj=next((x for x in env if isinstance(x,dict) and x.get("key")=="DATABASE_SSL_CA_PEM"),{})
          pem=obj.get("real_value") or obj.get("value") or ""
          if not isinstance(pem,str):pem=""
          print("CA configured value length class:", "tiny" if len(pem)<100 else ("short" if len(pem)<500 else "typical"))
          print("CA contains literal slash-n sequences:", "\\n" in pem)
          print("CA contains double escaped slash-n:", "\\\\n" in pem)
          print("CA literal starts with quotation mark:", pem.lstrip().startswith(('"',"'")))
          p=pem.replace("\\n","\n").strip()
          m=re.search(r"-----BEGIN CERTIFICATE-----\s*(.*?)\s*-----END CERTIFICATE-----",p,re.DOTALL)
          if not m: 
              print("CA contents not in recognizable PEM form.")
          else:
              b=m.group(1)
              base64_chars=re.sub(r"\s+","",b)
              print("CA body Base64 length class:", "tiny" if len(base64_chars)<100 else ("short" if len(base64_chars)<500 else "typical"))
              try:
                  der=base64.b64decode(base64_chars,validate=True)
                  print("CA DER first-byte SEQUENCE present:",len(der)>0 and der[0]==0x30)
                  print("CA DER byte length class:", "tiny" if len(der)<100 else ("short" if len(der)<500 else "typical"))
              except (ValueError,base64.binascii.Error):
                  print("CA body failed strict Base64 decoding")
              with tempfile.NamedTemporaryFile(mode="w",suffix=".pem") as tmp:
                  tmp.write(p);tmp.flush()
                  run=subprocess.run(["openssl","x509","-in",tmp.name,"-noout"],capture_output=True,text=True)
                  if run.returncode:
                      e=run.stderr.lower()
                      reason=("base64 decoding" if "base64" in e else
                              "malformed PEM or certificate" if "unable to load" in e or "expecting" in e else
                              "ASN.1 DER decoding" if "asn1" in e else "invalid X.509 certificate")
                      print("CA invalid category:",reason)
                  else: print("CA is syntactically valid X.509")
          print("No raw certificate text emitted; no resources changed.")
          PY


      - name: Verify extracting clean PEM fixes Coolify's quoted certificate
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          python - <<'PY'
          import os,json,re,tempfile,subprocess,urllib.request
          path=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1/applications/"+os.environ["COOLIFY_API_UUID"]+"/envs"
          req=urllib.request.Request(path,headers={"Authorization":"Bearer "+os.environ["COOLIFY_TOKEN"]})
          with urllib.request.urlopen(req,timeout=25) as res: env=json.load(res)
          if isinstance(env,dict):env=env.get("data",env.get("envs",[]))
          cert=next((e.get("real_value") or e.get("value") for e in env if isinstance(e,dict) and e.get("key")=="DATABASE_SSL_CA_PEM"),"")
          cleaned=cert.replace("\\n","\n").strip()
          blocks=re.findall(r"-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----",cleaned)
          print("Extracted X.509 PEM blocks:",len(blocks))
          for i,block in enumerate(blocks[:5]):
              with tempfile.NamedTemporaryFile(mode="w",suffix=".pem") as f:
                  f.write(block+"\n")
                  f.flush()
                  p=subprocess.run(["openssl","x509","-in",f.name,"-noout","-text"],capture_output=True,text=True)
                  print("Block",i+1,"valid X.509:",p.returncode==0)
                  if p.returncode==0:
                      print("Block",i+1,"CA TRUE:","CA:TRUE" in p.stdout)
                      print("Block",i+1,"valid today:",subprocess.run(["openssl","x509","-in",f.name,"-checkend","0","-noout"],capture_output=True).returncode==0)
          print("No certificate or secrets printed; audit read-only.")
          PY


      - name: Audit deployed MIMT resource provenance and trusted CA mounts
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          h={"Authorization":"Bearer "+os.environ["COOLIFY_TOKEN"],"Accept":"application/json"}
          def fetch(path):
            try:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=h),timeout=20) as r: return json.loads(r.read(1000000))
            except urllib.error.HTTPError as e:
              print("Read endpoint",path.split("/")[1],"HTTP",e.code)
            except Exception as e: print("Read endpoint exception class",type(e).__name__)
          app=fetch("/applications/"+os.environ["COOLIFY_API_UUID"])
          if isinstance(app,dict):
            print("MIMT application healthy:",str(app.get("status","")).startswith("running"))
            print("MIMT connected to Docker network:",bool(app.get("connect_to_docker_network")))
            print("MIMT app build type Dockerfile:",str(app.get("build_pack","")).lower()=="dockerfile")
            print("MIMT app dockerfile path configured:",bool(app.get("dockerfile")))
          st=fetch("/applications/"+os.environ["COOLIFY_API_UUID"]+"/storages")
          if isinstance(st,dict):
            for typ in ("persistent_storages","file_storages"):
              arr=st.get(typ) or []
              print("MIMT",typ,"count",len(arr))
              for ob in arr:
                if not isinstance(ob,dict):continue
                target=str(ob.get("mount_path",ob.get("mount_path_backup","")))
                origin=str(ob.get("fs_path",ob.get("host_path","")))
                print("CA mount",typ,"target /etc/ssl/certs/coolify-ca.crt:",target=="/etc/ssl/certs/coolify-ca.crt",
                  "origin matches Coolify CA location:",origin=="/data/coolify/ssl/coolify-ca.crt")
          else: print("Application storage listing unavailable")
          services=fetch("/services")
          if isinstance(services,dict):services=services.get("data",services.get("services",[]))
          if isinstance(services,list):
            print("Accessible Coolify compose services:",len(services))
            for ob in services[:30]:
              if not isinstance(ob,dict):continue
              name=str(ob.get("name",""))
              raw=str(ob.get("docker_compose_raw",""))
              print("Service postgres component:",any(k in raw.lower() for k in ("postgres:","postgresql","supabase-db")),
                    "MIMT-named:",("mimt" in name.lower()))
          else: print("Service inventory unavailable")
          db=fetch("/databases")
          if isinstance(db,dict):db=db.get("data",db.get("databases",[]))
          if isinstance(db,list):
            print("Accessible standalone PostgreSQL resources:",sum(1 for d in db if "postgres" in str(d.get("type","")).lower()))
          print("MIMT resource audit finished; no mutations made")
          PY


      - name: Cross-check MIMT DB host against Coolify Compose PostgreSQL service
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,re,urllib.parse
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          hdr={"Authorization":"Bearer "+os.environ["COOLIFY_TOKEN"],"Accept":"application/json"}
          def get(path):
            with urllib.request.urlopen(urllib.request.Request(base+path,headers=hdr),timeout=25) as response: return json.load(response)
          env=get("/applications/"+os.environ["COOLIFY_API_UUID"]+"/envs")
          if isinstance(env,dict):env=env.get("data",env.get("envs",[]))
          d=next((item.get("real_value") or item.get("value") for item in env if item.get("key")=="DATABASE_URL"),None)
          if not d:raise SystemExit("Cannot check DB URL safely")
          info=urllib.parse.urlsplit(d)
          host=info.hostname or ""
          print("DB host name length:",len(host))
          print("DB hostname contains Docker separator:",("-" in host or "_" in host))
          print("DB target port:",info.port or 5432)
          svc=get("/services")
          if isinstance(svc,dict):svc=svc.get("data",svc.get("services",[]))
          for ob in svc or []:
            raw=str(ob.get("docker_compose_raw") or "")
            if not ("postgres" in raw.lower()):continue
            print("Compose source includes PostgreSQL:",True)
            print("DB hostname occurs in compose raw:",bool(host and host in raw))
            print("DB hostname is a Compose top-level service:",bool(re.search(r"^  "+re.escape(host)+r":\s*$",raw,re.M)))
            print("Compose specifies explicit PostgreSQL SSL cert:",bool(re.search(r"ssl_cert_file|server\.crt|sslrootcert",raw,re.I)))
            print("Compose specifies private/internal PostgreSQL CA:",bool(re.search(r"ca\.crt|ca\.pem|root\.crt|coolify-ca",raw,re.I)))
            print("Compose exposes PostgreSQL port:",bool(re.search(r"(?m)^\s*-\s*['\\\"]?5432:",raw)))
            print("Compose has network declarations:",bool(re.search(r"(?m)^\s*networks:",raw)))
            print("Compose SSL postgres command/config:",bool(re.search(r"ssl\s*=\s*on|ssl=on",raw,re.I)))
            print("Compose contains Supabase DB component:",bool(re.search(r"supabase-db|supabase/postgres",raw,re.I)))
            print("Compose has db service:",bool(re.search(r"(?m)^\s+(?:db|postgres|postgresql):\s*$",raw)))
          print("Only structural classifications shown; no hostnames, credentials or YAML output.")
          PY


      - name: Classify DB URL and certificate variable serialization without leaking values
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1/applications/"+os.environ["COOLIFY_API_UUID"]+"/envs"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["COOLIFY_TOKEN"]})
          with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
          if isinstance(data,dict):data=data.get("data",data.get("envs",[]))
          for key in ("DATABASE_URL","DATABASE_SSL_CA_PEM"):
            ob=next((x for x in data if isinstance(x,dict) and x.get("key")==key),{})
            if not ob:
              print(key,"not returned")
              continue
            print(key,"is_literal:",ob.get("is_literal"),"is_multiline:",ob.get("is_multiline"),"is_shown_once:",ob.get("is_shown_once"),"is_runtime:",ob.get("is_runtime"))
            for member in ("real_value","value"):
              v=ob.get(member)
              if not isinstance(v,str):continue
              z=v.strip()
              print(key,member,"nonempty:",bool(z),"length_class:","tiny" if len(z)<70 else "normal",
                  "leading quote:",z.startswith(("'",'"')),
                  "trailing quote:",z.endswith(("'",'"')),
                  "postgres_scheme:",z.lower().startswith(("postgres://","postgresql://")),
                  "postgres_after_stripping_quotes:",z.strip(chr(34)+chr(39)).lower().startswith(("postgres://","postgresql://")),
                  "starts_env_reference:",z.startswith(("$","{{")),
                  "is_private_flag:",bool(ob.get("is_preview")))
          print("Only syntax flags shown. No connection strings, secrets or certificate data emitted.")
          PY

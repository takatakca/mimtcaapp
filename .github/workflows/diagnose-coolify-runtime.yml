name: MIMT Coolify Read-only Runtime Audit

# Temporary diagnostic: never prints secret values, environment connection
# strings, database names, application UUIDs, or API response bodies.
on:
  push:
    branches: [diag/mimt-coolify-runtime-audit-20261010]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Coolify application and database configuration safely
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse

          endpoint=os.environ.get("COOLIFY_URL","").rstrip("/")
          token=os.environ.get("COOLIFY_TOKEN","")
          uuid=os.environ.get("COOLIFY_API_UUID","")
          if not endpoint.startswith("https://") or not token or not uuid:
              raise SystemExit("Audit cannot proceed: missing HTTPS Coolify connection or credentials")
          url=endpoint+"/api/v1"
          hdr={"Authorization":"Bearer "+token,"Accept":"application/json"}

          def get(path):
              req=urllib.request.Request(url+path,headers=hdr,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:
                      data=json.loads(res.read(1500000).decode())
                      return data
              except urllib.error.HTTPError as exc:
                  print("Coolify GET",path.rsplit("/",1)[-1] if not path.startswith("/applications/") else "application endpoint","HTTP",exc.code)
                  return None
              except Exception as exc:
                  print("Coolify API request failed:",type(exc).__name__)
                  return None

          app=get("/applications/"+urllib.parse.quote(uuid,safe=""))
          if isinstance(app,dict):
              for k in ("status","build_pack","dockerfile","base_directory","publish_directory","ports_exposes"):
                  val=app.get(k)
                  if val is None: continue
                  if k == "status" and isinstance(val,str):
                      print("Coolify app status:",val[:60])
                  elif k=="ports_exposes":
                      print("Coolify exposes 8080:", "8080" in str(val))
                  elif k=="build_pack":
                      print("Coolify build pack Dockerfile:",str(val).lower()=="dockerfile")
                  else:
                      print("Coolify",k,"configured:",bool(val))
          else:
              print("Coolify application metadata unavailable.")

          env=get("/applications/"+urllib.parse.quote(uuid,safe="")+"/envs")
          keys={}
          if isinstance(env,dict):
              env=env.get("data",env.get("envs",[]))
          if isinstance(env,list):
              for v in env:
                  if isinstance(v,dict) and isinstance(v.get("key"),str):
                      keys[v["key"]]=v
              print("Coolify env variable count:",len(keys))
              for k in ("DATABASE_URL","DATABASE_SSL_CA_PEM","NODE_EXTRA_CA_CERTS","NODE_TLS_REJECT_UNAUTHORIZED","PUBLIC_BASE_URL","NODE_ENV","PORT"):
                  print("CONFIG",k,"present:",k in keys)
              def retrieve(k):
                  ob=keys.get(k,{})
                  v=ob.get("real_value") or ob.get("value")
                  return v if isinstance(v,str) else None
              conn=retrieve("DATABASE_URL")
              if conn:
                  try:
                      parsed=urllib.parse.urlsplit(conn)
                      host=(parsed.hostname or "").lower()
                      group="supabase" if "supabase" in host else ("internal-docker" if not "." in host or host.endswith(".internal") else "external-other")
                      print("DB host class:",group)
                      print("DB URL port:",parsed.port or "default")
                      opts=urllib.parse.parse_qs(parsed.query)
                      print("DB URL SSL flags:",{k:("present" if k in opts else "absent") for k in ("sslmode","ssl","sslrootcert")})
                      for k in ("sslmode",):
                          if k in opts:
                              print("DB SSL mode:",opts[k][0] if opts[k][0] in ("disable","allow","prefer","require","verify-ca","verify-full","no-verify") else "other")
                  except (ValueError,AttributeError):
                      print("DB URL could not be structurally parsed.")
              else:
                  print("DB URL value hidden from this API (presence alone doesn't prove correctness).")
              pem=retrieve("DATABASE_SSL_CA_PEM")
              if pem:
                  print("Database CA PEM formatting:", "valid PEM markers" if "BEGIN CERTIFICATE" in pem and "END CERTIFICATE" in pem else "NOT PEM")
              elif "DATABASE_SSL_CA_PEM" in keys:
                  print("Database CA PEM is defined but value hidden, can't validate.")
              else:
                  print("Database CA PEM not configured in Coolify.")
              if retrieve("NODE_TLS_REJECT_UNAUTHORIZED")=="0":
                  print("WARNING: TLS verification globally disabled! Remove unsafe setting.")
          else:
              print("Could not inspect Coolify environment variable names.")
          dbs=get("/databases")
          if isinstance(dbs,dict):
              dbs=dbs.get("data",dbs.get("databases",[]))
          if isinstance(dbs,list):
              print("Coolify standalone database resources:",len(dbs))
              for d in dbs[:30]:
                  if not isinstance(d,dict):continue
                  nam=str(d.get("name",""))
                  print("DB Resource: type=",str(d.get("type") or d.get("database_type") or "unknown")[:30],
                        "is MIMT-named=",("mimt" in nam.lower()),
                        "status=",str(d.get("status") or "unknown")[:60],
                        "SSL field present=",any("ssl" in k.lower() for k in d.keys()))
          else:
              print("Coolify database listing unavailable (possibly insufficient token permissions).")
          print("Audit complete. No secrets, database URLs, or private endpoints printed. NO resources modified.")
          PY


      - name: Check database CA certificate metadata and sanitize runtime errors
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,ssl,re,datetime,urllib.request,urllib.error,tempfile,subprocess
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          uid=os.environ["COOLIFY_API_UUID"]
          token=os.environ["COOLIFY_TOKEN"]
          def get(suffix):
              req=urllib.request.Request(base+"/applications/"+uid+suffix,
                  headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      return json.loads(r.read(500000).decode())
              except urllib.error.HTTPError as e:
                  print("Coolify request",suffix or "/application","HTTP",e.code)
              except Exception as e:
                  print("Coolify request",suffix or "/application","failed:",type(e).__name__)
              return None
          app=get("")
          if isinstance(app,dict):
              for name in ("git_commit_sha","git_repository","git_branch","status"):
                  v=app.get(name)
                  if name=="git_commit_sha":print("Coolify current git commit:",str(v)[:12] if v else "not supplied")
                  elif name=="git_repository":print("Coolify repository matches MIMT:", "mimt" in str(v).lower())
                  elif name=="git_branch":print("Coolify branch main:",v=="main")
                  elif name=="status":print("Coolify status:",str(v)[:64])
          env=get("/envs")
          if isinstance(env,dict):env=env.get("data",env.get("envs",[]))
          def getkey(name):
              if not isinstance(env,list):return None
              return next((v for v in env if isinstance(v,dict) and v.get("key")==name),None)
          cert=getkey("DATABASE_SSL_CA_PEM")
          if cert:
              for name in ("is_runtime","is_buildtime","is_multiline","is_literal"):
                  print("DATABASE_SSL_CA_PEM",name,cert.get(name,"unspecified"))
              pem=cert.get("real_value") or cert.get("value") or ""
              if isinstance(pem,str):
                  pem=pem.replace("\\n","\n")
                  certs=re.findall("-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",pem,re.DOTALL)
                  print("PEM certificate count:",len(certs))
                  if certs:
                      with tempfile.NamedTemporaryFile(mode="w",suffix=".pem") as tmp:
                          tmp.write(certs[0]);tmp.flush()
                          p=subprocess.run(["openssl","x509","-in",tmp.name,"-noout","-text"],capture_output=True,text=True)
                          if p.returncode!=0:
                              print("CA certificate parse: INVALID")
                          else:
                              print("CA certificate parse: VALID")
                              detail=p.stdout
                              print("CA basic constraints CA:TRUE:",bool(re.search(r"CA:TRUE",detail)))
                              print("CA currently within validity period:",subprocess.run(
                                  ["openssl","x509","-in",tmp.name,"-checkend","0","-noout"],
                                  capture_output=True).returncode==0)
          else:
              print("DATABASE_SSL_CA_PEM: unavailable")
          resp=get("/logs?lines=120")
          if isinstance(resp,dict):
              logs=str(resp.get("logs") or "")
              patterns=[
                  ("self-signed certificate chain",r"self-signed certificate in certificate chain"),
                  ("TLS unable to verify",r"unable to verify|certificate verify failed"),
                  ("hostname mismatch",r"hostname.*mismatch|ERR_TLS_CERT_ALTNAME_INVALID"),
                  ("startup invalid sslrootcert",r"unrecognized configuration parameter.*sslrootcert|invalid configuration parameter.*sslrootcert"),
                  ("auth failed",r"password authentication failed"),
                  ("DB connection refused",r"ECONNREFUSED"),
                  ("DB timeout",r"ETIMEDOUT|CONNECT_TIMEOUT"),
                  ("DB DNS error",r"ENOTFOUND"),
                  ("outbox failure",r"outbox delivery failed")
              ]
              print("Sanitized runtime log categories (may include repeat stacks):")
              for label,pattern in patterns:
                  print(label+":",len(re.findall(pattern,logs,re.I)))
              print("Log returned characters:",len(logs))
          print("Certificate/log diagnostic complete. No secrets or full logs printed; no resources changed.")
          PY

name: Diagnose MochaHost FTP TLS Certificate

# Read-only TLS negotiation. Never sends USER/PASS or changes remote files.
on:
  push:
    branches: [diag/mimt-ftp-root-20261010]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read FTP TLS certificate without logging in
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.MOCHAHOST_FTP_SERVER }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ftplib, ssl, os, subprocess, tempfile
          host = os.environ["FTP_SERVER"]
          if not host:
              raise SystemExit("Missing FTP_SERVER")
          ftp = ftplib.FTP_TLS(context=ssl._create_unverified_context(), timeout=20)
          # Unverified TLS is used *only to inspect the public certificate*;
          # do not call login() or send credentials in this workflow.
          try:
              ftp.connect(host, 21)
              ftp.auth()
              binary = ftp.sock.getpeercert(binary_form=True)
              pem = ssl.DER_cert_to_PEM_cert(binary)
              with tempfile.NamedTemporaryFile(mode="w", suffix=".pem", delete=False) as f:
                  f.write(pem)
                  path = f.name
              try:
                  p = subprocess.run(
                      ["openssl", "x509", "-in", path, "-noout", "-subject", "-issuer", "-dates", "-ext", "subjectAltName"],
                      capture_output=True, text=True, check=False
                  )
                  print("FTP server certificate details (public information):")
                  print(p.stdout.strip())
                  if p.returncode:
                      print("Certificate parse error:", p.stderr.strip()[:500])
              finally:
                  os.unlink(path)
              print("No FTP credentials were sent and no server files were changed.")
          finally:
              ftp.close()
          PY

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Rapid sequential commits must not consume CI runners or trigger publication of
# obsolete builds. Only the newest head on each branch is actionable.
concurrency:
  group: mimt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mimt/shared build
      - name: Check MIMT off-host backup safeguards with hermetic fakes
        run: bash scripts/db/test-backup-mimt.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mimt/web build
      - run: pnpm --filter @mimt/webphone build
      - name: Preserve deploy safety and project handoff contract
        shell: bash
        run: |
          set -euo pipefail
          for file in AGENTS.md WORKLOG.md docs/PROJECT_STATUS.md docs/TASK_QUEUE.md docs/AGENT_HANDOFF.md docs/DEPLOYMENT.md docs/DECISIONS.md; do
            test -s "$file"
          done
          grep -Fq 'release-candidate:' .github/workflows/auto-deploy-website.yml
          grep -Fq 'id: release-gate' .github/workflows/auto-deploy-website.yml
          grep -Fq 'mimt-release.json' .github/workflows/auto-deploy-website.yml
          grep -Fq 'mimt-release.json' .github/workflows/deploy.yml
          grep -Fq 'https://app.mimt.ca/mimt-release.json' .github/workflows/deploy.yml
      - name: Verify Apache SPA routing file included in built webphone
        run: |
          test -f apps/webphone/dist/.htaccess
          grep -Fq 'RewriteRule ^ index.html [L]' apps/webphone/dist/.htaccess
          grep -Fq 'Header always set X-Frame-Options "DENY"' apps/webphone/dist/.htaccess
          grep -Fq 'Header always set Referrer-Policy "no-referrer"' apps/webphone/dist/.htaccess
          grep -Fq 'Header always set Cache-Control "no-cache, no-store, must-revalidate"' apps/webphone/dist/.htaccess
          grep -Fq 'name="robots" content="noindex, nofollow, noarchive"' apps/webphone/dist/index.html
          grep -Fq 'Header always set Strict-Transport-Security' apps/webphone/dist/.htaccess
          grep -Fq "frame-ancestors 'none'" apps/webphone/dist/.htaccess
          jq -e --arg expected "$GITHUB_SHA" '.commit == $expected' apps/webphone/dist/mimt-release.json
      - name: Verify Apache config included in the built website
        run: |
          test -f apps/web/out/.htaccess
          grep -Fq 'ErrorDocument 404 /404.html' apps/web/out/.htaccess
          grep -Fq 'Header always set Strict-Transport-Security' apps/web/out/.htaccess

  e2e:
    # Webphone (built, not mock mode) against the real API on its in-memory repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mimt/shared build
      - run: pnpm --filter @mimt/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @mimt/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7

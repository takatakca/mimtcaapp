name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mimt/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mimt/web build
      - run: pnpm --filter @mimt/webphone build
      - name: Verify Apache SPA routing file included in built webphone
        run: |
          test -f apps/webphone/dist/.htaccess
          grep -Fq 'RewriteRule ^ index.html [L]' apps/webphone/dist/.htaccess
          grep -Fq 'Header always set X-Frame-Options "DENY"' apps/webphone/dist/.htaccess
          grep -Fq 'Header always set Referrer-Policy "no-referrer"' apps/webphone/dist/.htaccess
          grep -Fq 'Header always set Cache-Control "no-cache, no-store, must-revalidate"' apps/webphone/dist/.htaccess
          grep -Fq 'name="robots" content="noindex, nofollow, noarchive"' apps/webphone/dist/index.html

  e2e:
    # Webphone (built, not mock mode) against the real API on its in-memory repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mimt/shared build
      - run: pnpm --filter @mimt/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @mimt/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7

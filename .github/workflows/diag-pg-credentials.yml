name: Diagnose MIMT PostgreSQL Credential Consistency
on:
  push:
    branches: [diag/mimt-db-password-consistency-20261011]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare private PG connection metadata without exposing passwords
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          h={"Authorization":"Bearer "+os.environ["COOLIFY_TOKEN"]}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=h),timeout=28) as r:
                  return json.loads(r.read(800000))
          ds=get("/databases")
          if isinstance(ds,dict):ds=ds.get("data",ds.get("databases",[]))
          d=[x for x in ds if x.get("name")=="mimt-prod-postgres"]
          if len(d)!=1:raise SystemExit("MIMT PG not unique")
          db=get("/databases/"+d[0]["uuid"])
          vars=get("/applications/"+os.environ["COOLIFY_API_UUID"]+"/envs")
          if isinstance(vars,dict):vars=vars.get("data",vars.get("envs",[]))
          uri=next((v.get("value","") for v in vars if v.get("key")=="DATABASE_URL"),"")
          dburi=db.get("internal_db_url") or ""
          a=urllib.parse.urlsplit(uri)
          b=urllib.parse.urlsplit(dburi)
          print("MIMT app and Coolify DB internal URL exactly match:",uri==dburi)
          print("App and DB internal host match:",a.hostname==b.hostname)
          print("App and DB internal username match:",a.username==b.username)
          print("App and DB internal URI password match:",a.password==b.password)
          print("DB internal URL password matches database configured password:",urllib.parse.unquote(b.password or "")==str(db.get("postgres_password") or ""))
          print("Configured database user correct:",db.get("postgres_user")=="mimt_owner")
          print("Configured database name correct:",db.get("postgres_db")=="mimt_production")
          print("MIMT app supplied migration flag:",any(v.get("key")=="MIMT_STANDALONE_BOOTSTRAP_ONCE" for v in vars))
          print("MIMT DB status:",db.get("status"))
          print("No usernames, passwords or connection URLs printed.")
          PY
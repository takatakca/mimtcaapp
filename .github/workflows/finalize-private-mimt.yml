name: Finalize MIMT Private PostgreSQL Cutover
on:
  push:
    branches: [ops/mimt-cleanup-bootstrap-20261011]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live database, remove one-time flags, restart, and check again
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse,time
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          app=os.environ["COOLIFY_API_UUID"]
          token=os.environ["COOLIFY_TOKEN"]
          hdr={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"}
          def request(method,path,body=None):
              req=urllib.request.Request(base+path,headers=hdr,method=method,
                   data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(req,timeout=38) as response:
                  content=response.read(200000)
                  return response.status,json.loads(content) if content else {}
          def readiness():
              url="https://api.mimt.ca/readyz?verify="+str(time.time_ns())
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:
                      return response.status,json.loads(response.read(1500))
              except urllib.error.HTTPError as e:
                  try: data=json.loads(e.read(1500))
                  except Exception: data={}
                  return e.code,data
              except Exception: return 0,{}
          status,ready=readiness()
          print("Baseline readiness before cleanup:",status,"db",ready.get("db"),flush=True)
          if status!=200 or ready.get("ok") is not True or ready.get("db")!="up":
              raise SystemExit("No longer ready before cleanup; preserving current configuration.")
          _,env=request("GET","/applications/"+app+"/envs")
          if isinstance(env,dict):env=env.get("data",env.get("envs",[]))
          if not isinstance(env,list):raise SystemExit("Cannot inspect envs; no modification.")
          urls=[e for e in env if e.get("key")=="DATABASE_URL"]
          if len(urls)!=1:raise SystemExit("Ambiguous database URL, abort.")
          uri=urllib.parse.urlsplit(urls[0].get("value",""))
          if (not uri.hostname or "." in uri.hostname or uri.path!="/mimt_production" or
              urllib.parse.unquote(uri.username or "")!="mimt_owner"):
              raise SystemExit("Database URL no longer uniquely points to private MIMT PG")
          if any(e.get("key")=="DATABASE_SSL_CA_PEM" for e in env):
              raise SystemExit("Obsolete CA present again; abort.")
          flag_names=("MIMT_STANDALONE_BOOTSTRAP_ONCE","MIMT_STANDALONE_MIGRATE_CONFIRM")
          flags=[e for e in env if e.get("key") in flag_names]
          if len(flags)>2 or len({e.get("key") for e in flags})!=len(flags):
              raise SystemExit("Duplicate temporary flags, abort.")
          for e in flags:
              if e.get("key")=="MIMT_STANDALONE_BOOTSTRAP_ONCE" and e.get("value")!="YES_STARTUP_MIGRATE":
                  raise SystemExit("Unexpected first migration flag; no changes")
              if e.get("key")=="MIMT_STANDALONE_MIGRATE_CONFIRM" and e.get("value")!="YES_MY_PRIVATE_MIMT_DATABASE":
                  raise SystemExit("Unexpected second migration flag; no changes")
          print("Ready production API verified. One-time flags found:",len(flags),flush=True)
          for e in flags:
              if not e.get("uuid"):raise SystemExit("Missing flag ID")
              status,_=request("DELETE","/applications/"+app+"/envs/"+e["uuid"])
              if status not in (200,204):raise SystemExit("Flag deletion failed; manual review")
              print("Removed one-shot variable:",e["key"],flush=True)
          _,again=request("GET","/applications/"+app+"/envs")
          if isinstance(again,dict):again=again.get("data",again.get("envs",[]))
          if any(e.get("key") in flag_names for e in again):raise SystemExit("Flag cleanup not persisted")
          print("One-time migration flags removed and Coolify configuration verified.",flush=True)
          # Restart process so the cleared flags are absent from the next runtime.
          status,_=request("POST","/applications/"+app+"/restart")
          print("Coolify API restart accepted:",status,flush=True)
          if status not in (200,202):raise SystemExit("API restart not accepted")
          for attempt in range(25):
              time.sleep(8)
              status,ready=readiness()
              print("Final readiness",attempt+1,"HTTP",status,"db",ready.get("db"),flush=True)
              if status==200 and ready.get("ok") is True and ready.get("db")=="up":
                  print("SUCCESS: MIMT private PostgreSQL production is ready without startup migration flags.",flush=True)
                  break
          else:
              raise SystemExit("API not ready after restart; investigate Coolify before calling complete")
          PY
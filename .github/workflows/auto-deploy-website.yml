name: Auto deploy MIMT website

# Only the public, pre-launch static website is eligible for automatic publishing.
# Telecom API, billing and emergency-call integrations remain manual release gates.
#
# Since 2026-10-26 mimt.ca and www.mimt.ca are served by Coolify (vps1, application mimt-web), not MochaHost.
# Coolify builds main on every push and its build runs scripts/verify-out.mjs, so a broken site never goes
# live. This workflow no longer uploads anything: once CI passes, it confirms that the public site serves
# that exact commit (out/mimt-release.json is written by the build from SOURCE_COMMIT).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mimt-public-website-production
  cancel-in-progress: false

jobs:
  # Cheap remote HEAD check: a superseded CI run has nothing to confirm, the newer push is checked by its own run.
  release-candidate:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.compare.outputs.current }}
    steps:
      - name: Compare approved CI SHA with current remote main
        id: compare
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI revision superseded: no build and no deployment."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  confirm-website:
    needs: release-candidate
    if: needs.release-candidate.outputs.current == 'true'
    runs-on: ubuntu-latest
    steps:
      # Coolify starts building on the push itself; CI usually takes longer, so the first attempt often passes.
      # Up to 15 minutes covers a slow Coolify build. A newer push to main ends the wait without failing:
      # its own CI run confirms the newer commit.
      - name: Confirm published website content, revision and reject old provider content
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            html="$(curl -fsSL --connect-timeout 8 --max-time 20 "https://mimt.ca/?release=${RELEASE_SHA}" 2>/dev/null || true)"
            manifest="$(curl -fsSL --connect-timeout 8 --max-time 20 "https://mimt.ca/mimt-release.json?release=${RELEASE_SHA}" 2>/dev/null || true)"
            if [[ "$html" == *"Votre numéro canadien"* ]] &&
               ! grep -Eiq 'Fongo (Mobile|Works|Internet|World|Home Phone)|Waterloo, Ontario|About Fongo' <<<"$html" &&
               jq -e --arg expected "$RELEASE_SHA" '.commit == $expected' <<<"$manifest" >/dev/null 2>&1; then
              echo "Published MIMT French website at the expected CI-validated commit: $RELEASE_SHA."
              exit 0
            fi
            current="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
            if [[ "$current" != "$RELEASE_SHA" ]]; then
              echo "::notice::main moved on to ${current}; its own CI run confirms the newer website."
              exit 0
            fi
            served="$(jq -r '.commit // "none"' <<<"$manifest" 2>/dev/null || echo none)"
            echo "Attempt ${attempt}/60: mimt.ca serves commit ${served}, waiting for ${RELEASE_SHA}."
            sleep 15
          done
          echo "::error::mimt.ca did not serve ${RELEASE_SHA} within 15 minutes. Check the mimt-web deployment in Coolify (build log, then https://mimt.ca/mimt-release.json)."
          exit 1

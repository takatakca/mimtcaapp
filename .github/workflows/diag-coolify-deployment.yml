name: Inspect MIMT Coolify Deployment State
on:
  push:
    branches: [diag/mimt-coolify-deploy-status-20261011]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest MIMT deployments safely
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,re
          base=os.environ["COOLIFY_URL"].rstrip("/")+"/api/v1"
          h={"Authorization":"Bearer "+os.environ["COOLIFY_TOKEN"]}
          uid=os.environ["COOLIFY_API_UUID"]
          try:
              with urllib.request.urlopen(urllib.request.Request(base+"/deployments/applications/"+uid+"?take=5",headers=h),timeout=25) as r:
                  data=json.load(r)
          except urllib.error.HTTPError as e:
              print("Deployment list HTTP",e.code)
              raise SystemExit(0)
          if isinstance(data,dict):data=data.get("data",data.get("deployments",[]))
          for i,ob in enumerate((data if isinstance(data,list) else [])[:5]):
              print("Deployment",i+1,
                    "status:",ob.get("status"),
                    "commit_matches_recent_main:",str(ob.get("commit","")).startswith("a4d5fdbd"),
                    "created:",str(ob.get("created_at",""))[:19],
                    "updated:",str(ob.get("updated_at",""))[:19])
              log=str(ob.get("logs",""))
              for name,pattern in [
                  ("Docker build failed",r"build failed|failed to build|ERROR: process"),
                  ("Migration error",r"migration checksum changed|refusing to migrate|permission denied"),
                  ("Auth failures",r"password authentication failed"),
                  ("DB network lookup",r"ENOTFOUND|EAI_AGAIN"),
              ]:
                  print("  sanitized indicator",name,":",len(re.findall(pattern,log,re.I)))
          if isinstance(data,list) and data:
              latest=data[0]
              depl=latest.get("deployment_uuid") or latest.get("uuid")
              if depl:
                  with urllib.request.urlopen(urllib.request.Request(base+"/deployments/"+depl,headers=h),timeout=25) as r:
                      detail=json.load(r)
                  raw=detail.get("logs") or ""
                  if isinstance(raw,list):
                      raw="\\n".join(str(z.get("output") or z.get("message") or "") if isinstance(z,dict) else str(z) for z in raw)
                  raw=str(raw)
                  print("Failure log payload length class:","empty" if not raw else "short" if len(raw)<1000 else "long")
                  patterns=[
                      ("Build COPY or source path missing",r"failed to compute cache key|failed to calculate checksum|COPY failed|not found in build context"),
                      ("Docker image build failed",r"failed to solve|build failed|ERROR: process .* did not complete"),
                      ("Deployment container health failed",r"healthcheck failed|container is unhealthy|unhealthy"),
                      ("MIMT schema migration refused",r"MIMT_STANDALONE|Migration checksum changed|private Docker-network"),
                      ("Unable to connect to new private database",r"ECONNREFUSED|ENOTFOUND|password authentication failed"),
                      ("Insufficient disk or memory",r"No space left on device|out of memory|OOMKilled"),
                      ("Unhandled application startup exception",r"uncaught exception|process exited|exit code 1"),
                      ("Docker network connection failed",r"network .* not found|could not attach"),
                  ]
                  for name,pattern in patterns:
                      print("Failure category",name,len(re.findall(pattern,raw,re.I)))
          if isinstance(data,list) and data:
              latest=data[0]
              depl=latest.get("deployment_uuid") or latest.get("uuid")
              if depl:
                  with urllib.request.urlopen(urllib.request.Request(base+"/deployments/"+depl,headers=h),timeout=25) as r:
                      detail=json.load(r)
                  raw=detail.get("logs") or ""
                  lines=raw if isinstance(raw,list) else str(raw).splitlines()
                  suspicious=[]
                  for ob in lines:
                      line=str(ob.get("output") or ob.get("message") or "") if isinstance(ob,dict) else str(ob)
                      if re.search(r"(?i)unhealthy|failed|container.*exited|healthcheck|error",line):
                          # redact URLs, secrets, email addresses, high-entropy IDs, and arbitrary quotes
                          line=re.sub(r"(?:postgres(?:ql)?|https?)://\\S+","[redacted-url]",line)
                          line=re.sub(r"(?i)(password|token|secret|key)=\\S+",r"\\1=[redacted]",line)
                          line=re.sub(r"[A-Za-z0-9+/=]{45,}","[redacted-id]",line)
                          line=re.sub(r"\\"[^\\"]{30,}\\"","[redacted-quote]",line)
                          suspicious.append(line[-210:])
                  print("Sanitized failure-context lines (last 8):")
                  for line in suspicious[-8:]:print("CONTEXT:",line)
          print("No deployment log or secrets printed.")
          PY